<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baumzähler">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Baumzähler</title>
<style>
  :root{
    --bg:#1a2421; --panel:#243430; --panel2:#2e423c; --line:#3a524a;
    --text:#f2f7f4; --muted:#9db8ae; --accent:#ffd23f; --danger:#e05252;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{flex:1; display:flex; flex-direction:column; min-height:0;}

  header{padding:10px 12px 6px;}
  .ctx{display:flex; gap:8px;}
  .ctx select{
    flex:1; min-width:0; background:var(--panel); color:var(--text);
    border:1px solid var(--line); border-radius:10px;
    font-size:16px; font-weight:600; padding:10px 8px; appearance:none;
  }
  .undobar{
    margin:6px 12px 0; padding:10px 12px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; gap:10px; min-height:46px;
  }
  .undobar .last{flex:1; font-size:14px; color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .undobar .last b{color:var(--text);}
  .undobar button{
    background:var(--panel2); color:var(--accent); border:1px solid var(--line);
    border-radius:8px; font-size:14px; font-weight:700; padding:8px 12px;
  }
  .undobar button:disabled{opacity:.35;}

  .grid{
    flex:1; min-height:0; display:grid; gap:10px; padding:10px 12px 12px;
    grid-template-columns:1fr 1fr;
  }
  .tile{
    border:none; border-radius:var(--radius); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-weight:800; padding:6px; position:relative; overflow:hidden;
    box-shadow:0 3px 0 rgba(0,0,0,.35);
  }
  .tile:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.35);}
  .tile .tname{font-size:clamp(19px,5.5vw,28px); line-height:1.1; text-shadow:0 1px 4px rgba(0,0,0,.6); text-align:center;}
  .tile .tsub{font-size:12px; font-weight:600; opacity:.9; margin-top:3px; text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .tile .tcount{
    position:absolute; top:5px; right:8px; font-size:13px; font-weight:700;
    background:rgba(0,0,0,.38); border-radius:99px; padding:2px 8px;
  }
  .tile.flagtile{box-shadow:inset 0 0 0 2px rgba(255,255,255,.18), 0 3px 0 rgba(0,0,0,.35);}
  .tile.flagtile .tname{font-size:clamp(16px,4.8vw,22px);}
  .tile.armed{outline:4px solid var(--accent); outline-offset:-4px;}
  .tile.menutile{background:var(--panel); border:2px dashed var(--line); color:var(--text); box-shadow:none;}
  .tile.emptycell{background:transparent; box-shadow:none; pointer-events:none;}
  .flash{animation:flash .25s ease;}
  @keyframes flash{0%{filter:brightness(1.7);}100%{filter:brightness(1);}}
  @media (prefers-reduced-motion: reduce){ .flash{animation:none;} .tile:active{transform:none;} }

  .sizehead{
    margin:10px 12px 0; padding:14px; border-radius:var(--radius);
    font-size:19px; font-weight:800; color:#fff; text-align:center; text-shadow:0 1px 4px rgba(0,0,0,.55);
  }
  .backbtn{
    margin:0 12px 12px; padding:16px; border-radius:var(--radius);
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    font-size:17px; font-weight:700;
  }

  .page{flex:1; min-height:0; overflow-y:auto; padding:12px; -webkit-overflow-scrolling:touch;}
  .page h2{font-size:18px; margin:14px 0 8px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{text-align:left; padding:7px 3px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
  td.num{text-align:right; font-variant-numeric:tabular-nums; font-weight:700;}
  .dot{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px;}
  .row{display:flex; gap:7px; align-items:center; margin-bottom:8px; flex-wrap:nowrap;}
  .row .grow{flex:1; min-width:0; overflow:hidden;}
  .btn{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; font-size:15px; font-weight:700; padding:12px 14px;
  }
  .btn.primary{background:var(--accent); color:#1a2421; border-color:var(--accent);}
  .btn.danger{color:var(--danger);}
  .btn.small{padding:8px 10px; font-size:14px; min-width:38px;}
  .btn.tiny{padding:8px 6px; font-size:14px; min-width:32px;}
  .btn.wide{width:100%; margin-top:6px;}
  .muted{color:var(--muted); font-size:13px; line-height:1.4;}
  .corr{display:inline-flex; gap:6px;}
  .corr button{width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:17px; font-weight:800;}
  input[type=text]{background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:11px; font-size:16px; width:100%;}
  input[type=color]{border:1px solid var(--line); background:var(--panel2); border-radius:8px; width:40px; height:38px; padding:2px; flex:none;}
  select.mini{background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 6px; font-size:14px; font-weight:600; min-width:0;}
  .thumb{width:38px; height:38px; border-radius:8px; background-size:cover; background-position:center; flex:none; border:1px solid var(--line);}
  .badge{font-size:11px; background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:2px 6px; color:var(--muted); margin-left:5px; vertical-align:middle; white-space:nowrap;}
  .fbadge{font-size:11px; border-radius:6px; padding:2px 6px; color:#fff; margin-left:5px; vertical-align:middle; white-space:nowrap;}
  .warn{background:#5a3a16; border:1px solid #a9762d; color:#ffd9a0; border-radius:10px; padding:10px 12px; margin:10px 12px 0; font-size:13px; line-height:1.4;}
  .hidden{display:none !important;}
  footer.tabs{display:flex; border-top:1px solid var(--line); background:var(--panel);}
  footer.tabs button{
    flex:1; background:none; border:none; color:var(--muted);
    font-size:13px; font-weight:700; padding:11px 4px 13px;
  }
  footer.tabs button.active{color:var(--accent);}

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px; width:100%; max-width:380px; max-height:80vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 12px; font-size:17px;}
  .modal p{margin:0 0 14px; font-size:15px; line-height:1.45; color:var(--text); user-select:text;}
  .mbtns{display:flex; gap:8px; margin-top:14px;}
  .mbtns .btn{flex:1;}
  .mlist .btn{width:100%; margin-bottom:8px; text-align:left;}
</style>
</head>
<body>
<div id="storageWarn" class="warn hidden">
  ⚠️ Dauerhaftes Speichern ist hier nicht möglich. Bitte die App <b>im Browser bzw. über das Home-Bildschirm-Icon öffnen</b> – sonst gehen Zählungen beim Schließen verloren.
</div>
<div id="app"></div>
<footer class="tabs">
  <button id="tabCount">🌲 Zählen</button>
  <button id="tabReport">📊 Bericht</button>
  <button id="tabSettings">⚙️ Verwalten</button>
</footer>

<script>
"use strict";

/* ================= Hilfen ================= */
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normTxt(x){ return String(x).toLowerCase().replace(/[\s–—\-_.]/g,""); }
function tileStyle(color, img){
  return img
    ? "background-image:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.38)),url('"+img+"');background-size:cover;background-position:center;background-color:"+(color||"#3a524a")+";"
    : "background:"+(color||"#3a524a")+";";
}
function svgURI(svg){ return "data:image/svg+xml;utf8," + encodeURIComponent(svg); }
const PAT = {
  rotweiss:  svgURI('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><rect width="48" height="48" fill="#f4f4f4"/><g stroke="#d22a2a" stroke-width="11"><line x1="-14" y1="62" x2="62" y2="-14"/><line x1="10" y1="62" x2="86" y2="-14"/><line x1="-38" y1="62" x2="38" y2="-14"/></g></svg>'),
  gelbweiss: svgURI('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><rect width="48" height="48" fill="#f4f4f4"/><g fill="#e8c61e"><rect x="2" width="9" height="48"/><rect x="20" width="9" height="48"/><rect x="38" width="9" height="48"/></g></svg>'),
  gruenweiss:svgURI('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><rect width="48" height="48" fill="#f4f4f4"/><g fill="#1d4d22"><rect x="2" width="9" height="48"/><rect x="20" width="9" height="48"/><rect x="38" width="9" height="48"/></g></svg>'),
  lilaweiss: svgURI('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><rect width="48" height="48" fill="#f4f4f4"/><g stroke="#6b46c1" stroke-width="11"><line x1="-14" y1="62" x2="62" y2="-14"/><line x1="10" y1="62" x2="86" y2="-14"/><line x1="-38" y1="62" x2="38" y2="-14"/></g></svg>')
};

/* ================= Eigene Dialoge ================= */
function buildOverlay(inner){
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = '<div class="modal">'+inner+'</div>';
  document.body.appendChild(ov);
  return ov;
}
function askText(title, value){
  return new Promise(res=>{
    const ov = buildOverlay('<h3>'+esc(title)+'</h3><input type="text" id="mIn"><div class="mbtns"><button class="btn" id="mC">Abbrechen</button><button class="btn primary" id="mO">OK</button></div>');
    const inp = ov.querySelector("#mIn"); inp.value = value||""; setTimeout(()=>{ inp.focus(); inp.select(); }, 60);
    const done = v=>{ ov.remove(); res(v); };
    ov.querySelector("#mO").onclick = ()=>done(inp.value.trim()||null);
    inp.onkeydown = e=>{ if(e.key==="Enter") done(inp.value.trim()||null); };
    ov.querySelector("#mC").onclick = ()=>done(null);
  });
}
function askConfirm(text, okLabel, danger){
  return new Promise(res=>{
    const ov = buildOverlay('<h3>Bestätigen</h3><p>'+esc(text)+'</p><div class="mbtns"><button class="btn" id="mC">Abbrechen</button><button class="btn '+(danger?'danger':'primary')+'" id="mO">'+esc(okLabel||"OK")+'</button></div>');
    ov.querySelector("#mO").onclick = ()=>{ ov.remove(); res(true); };
    ov.querySelector("#mC").onclick = ()=>{ ov.remove(); res(false); };
  });
}
function askChoice(title, options){
  return new Promise(res=>{
    const ov = buildOverlay('<h3>'+esc(title)+'</h3><div class="mlist">'+options.map((o,i)=>'<button class="btn" data-i="'+i+'">'+esc(o)+'</button>').join("")+'</div><div class="mbtns"><button class="btn" id="mC">Abbrechen</button></div>');
    ov.querySelectorAll(".mlist .btn").forEach(b=>b.onclick=()=>{ ov.remove(); res(+b.dataset.i); });
    ov.querySelector("#mC").onclick = ()=>{ ov.remove(); res(null); };
  });
}
async function moveInArray(arr, idx, title){
  const c = await askChoice(title, ["⬆️ Ganz nach oben","↑ Eine Position hoch","↓ Eine Position runter","⬇️ Ganz nach unten"]);
  if(c===null) return false;
  const item = arr.splice(idx,1)[0];
  let ni = c===0 ? 0 : c===1 ? Math.max(0, idx-1) : c===2 ? Math.min(arr.length, idx+1) : arr.length;
  arr.splice(ni, 0, item);
  return true;
}
function pickImage(){
  return new Promise(res=>{
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.onchange = ()=>{
      const f = inp.files && inp.files[0];
      if(!f){ res(null); return; }
      const r = new FileReader();
      r.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          try{
            const max = 480;
            const sc = Math.min(1, max/Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = Math.max(1, Math.round(img.width*sc));
            c.height = Math.max(1, Math.round(img.height*sc));
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            res(c.toDataURL("image/jpeg", 0.7));
          }catch(e){ res(null); }
        };
        img.onerror = ()=>res(null);
        img.src = r.result;
      };
      r.onerror = ()=>res(null);
      r.readAsDataURL(f);
    };
    inp.click();
  });
}

/* ================= Standarddaten =================
   Ablauf: erst GRÖSSE wählen (Seite 1), dann TYP (Seite 2).
   Größen und Typen sind zentral definiert; Zähl-Schlüssel: typId|größenId|merkmalId */
const KEY = "baumzaehler_v4";
const OLDKEYS = ["baumzaehler_v3","baumzaehler_v2","baumzaehler_v1"];
let storageOK = true;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
catch(e){ storageOK = false; document.getElementById("storageWarn").classList.remove("hidden"); }
let memFallback = null;

function defaultState(){
  const gs = (label,color,img,extra)=>({id:uid(), label:label, color:color||null, img:img||null, extra:!!extra});
  const s45=gs("4,5 – 8 m","#59872c",null,true), s35=gs("3,5 – 4,5 m","#59872c",null,true),
        s25=gs("2,5 – 3,5 m","#59872c"), s2=gs("2 – 2,5 m",null,PAT.rotweiss),
        s175=gs("1,75 – 2 m",null,PAT.gelbweiss), s15=gs("1,5 – 1,75 m",null,PAT.lilaweiss),
        s1=gs("1 – 1,5 m",null,PAT.gruenweiss), s05=gs("0,5 – 1 m","#6f7d78"), s0=gs("0 – 0,5 m","#8a958f");
  return {
    v:4,
    sizes:[s45,s35,s25,s2,s175,s15,s1,s05,s0],
    types:[
      {id:"son", name:"Sonder (NM 3, BF 2)", color:"#0a2f8c", img:null},
      {id:"mue", name:"Vogel",               color:"#b02a64", img:null},
      {id:"blf", name:"Blaufichte",          color:"#103a52", img:null},
      {id:"u",   name:"Untergröße",          color:"#6f7d78", img:null},
      {id:"nm1", name:"NM 1",                color:"#59872c", img:null},
      {id:"nm2", name:"NM 2",                color:"#2e4d1e", img:null}
    ],
    flags:[
      {id:"vogel", name:"Vögel", color:"#b02a64"},
      {id:"laus",  name:"Läuse", color:"#aa6c1f"},
      {id:"m3",    name:"Merkmal 3", color:"#555f5b"}
    ],
    layoutSizes:[
      {h:"half", cells:["menu",      "s:"+s25.id]},
      {h:"full", cells:["s:"+s2.id,  "s:"+s175.id]},
      {h:"full", cells:["s:"+s15.id, "s:"+s1.id]},
      {h:"half", cells:["s:"+s05.id, "s:"+s0.id]}
    ],
    layoutTypes:[
      {h:"half", cells:["t:son","t:mue"]},
      {h:"full", cells:["t:blf","t:u"]},
      {h:"full", cells:["t:nm1","t:nm2"]},
      {h:"half", cells:["f:vogel","f:laus"]}
    ],
    fields:[ {id:uid(), name:"Feld 1", subs:[{id:uid(), name:"Bereich A", counts:{}, log:[]}]} ],
    activeField:null, activeSub:null
  };
}

/* ---- Migration v3 (Typ-zuerst mit Größen je Typ) -> v4 (zentrale Größen) ---- */
function migrateV3(o){
  const s = defaultState();
  if(o.flags && o.flags.length) s.flags = o.flags;
  // zentrale Größen aus allen Typ-Größen zusammenführen (nach Bezeichnung)
  const sizes = []; const mapKey = {}; // "altTyp|altGrößenId" -> neue GrößenId
  (o.types||[]).forEach(ot=>{
    (ot.sizes||[]).forEach(os=>{
      let g = sizes.find(x=>normTxt(x.label)===normTxt(os.label));
      if(!g){
        g = {id:uid(), label:os.label, color:os.color||null, img:os.img||null, extra:false};
        sizes.push(g);
      }
      mapKey[ot.id+"|"+os.id] = g.id;
    });
  });
  if(sizes.length) s.sizes = sizes;
  // Typen ohne Größen übernehmen
  if(o.types && o.types.length){
    s.types = o.types.map(t=>({
      id:t.id,
      name: normTxt(t.name)===normTxt("Müll (unverkäuflich)") ? "Vogel" : t.name,
      color:t.color, img:t.img||null
    }));
  }
  // Typen-Anordnung aus der alten Zählseiten-Anordnung
  if(o.layout && o.layout.length) s.layoutTypes = o.layout;
  // Größen-Anordnung: Standardgerüst, per Bezeichnung zugeordnet
  const find = lbl=>{
    const n = normTxt(lbl);
    const g = s.sizes.find(x=>{ const a=normTxt(x.label); return a===n || a.endsWith(n) || n.endsWith(a); });
    return g ? "s:"+g.id : null;
  };
  s.layoutSizes = [
    {h:"half", cells:["menu", find("2,5 – 3,5 m")]},
    {h:"full", cells:[find("2 – 2,5 m"),  find("1,75 – 2 m")]},
    {h:"full", cells:[find("1,5 – 1,75 m"), find("1 – 1,5 m")]},
    {h:"half", cells:[find("0,5 – 1 m"), find("0 – 0,5 m")]}
  ];
  // nicht platzierte Größen ins Mehr-Menü
  const placed = new Set();
  s.layoutSizes.forEach(r=>r.cells.forEach(c=>{ if(c && c.indexOf("s:")===0) placed.add(c.slice(2)); }));
  s.sizes.forEach(g=>{ if(!placed.has(g.id)) g.extra = true; });
  // Felder + Zählungen umschlüsseln
  if(o.fields && o.fields.length){
    s.fields = o.fields.map(f=>({
      id:f.id, name:f.name,
      subs:(f.subs||[]).map(sub=>{
        const counts = {}, log = [];
        for(const k in (sub.counts||{})){
          const p = k.split("|");
          const g = mapKey[p[0]+"|"+p[1]];
          if(!g) continue;
          const nk = p[0]+"|"+g+"|"+(p[2]||"");
          counts[nk] = (counts[nk]||0) + sub.counts[k];
        }
        (sub.log||[]).forEach(k=>{
          const p = k.split("|");
          const g = mapKey[p[0]+"|"+p[1]];
          if(g) log.push(p[0]+"|"+g+"|"+(p[2]||""));
        });
        return {id:sub.id, name:sub.name, counts:counts, log:log};
      })
    }));
  }
  s.activeField = o.activeField; s.activeSub = o.activeSub;
  return s;
}
function migrateAncient(o){
  const s = defaultState();
  if(o.fields && o.fields.length){
    s.fields = o.fields.map(f=>({id:f.id, name:f.name, subs:(f.subs||[]).map(sub=>({id:sub.id, name:sub.name, counts:{}, log:[]}))}));
  }
  return s;
}
function normalize(s){
  if(s && s.v===4 && s.sizes && s.types && s.flags && s.layoutSizes && s.layoutTypes && s.fields) return s;
  if(s && s.types && s.types.length && s.types[0] && s.types[0].sizes) return migrateV3(s);
  if(s && s.fields) return migrateAncient(s);
  return defaultState();
}
function load(){
  if(!storageOK){ if(!memFallback) memFallback = defaultState(); return memFallback; }
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const s = JSON.parse(raw); if(s) return normalize(s); }
    for(const ok of OLDKEYS){
      const old = localStorage.getItem(ok);
      if(old){ const o = JSON.parse(old); if(o) return normalize(o); }
    }
  }catch(e){}
  return defaultState();
}
let S = load();
if(!S.activeField || !S.fields.find(f=>f.id===S.activeField)) S.activeField = S.fields[0].id;
ensureActiveSub();
save();

function ensureActiveSub(){
  const f = curField();
  if(!f.subs.length) f.subs.push({id:uid(), name:"Bereich A", counts:{}, log:[]});
  if(!S.activeSub || !f.subs.find(s=>s.id===S.activeSub)) S.activeSub = f.subs[0].id;
}
function save(){
  if(!storageOK){ memFallback = S; return; }
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){
    alert("Achtung: Speichern fehlgeschlagen! Möglicherweise zu viele/zu große Fotos. Bitte Fotos entfernen oder Speicherplatz prüfen.");
  }
}
function curField(){ return S.fields.find(f=>f.id===S.activeField); }
function curSub(){ return curField().subs.find(s=>s.id===S.activeSub); }
function findSizeG(sid){ return S.sizes.find(x=>x.id===sid); }
function findType(tid){ return S.types.find(x=>x.id===tid); }
function findFlag(fid){ return S.flags.find(x=>x.id===fid); }

/* ================= Zähl-Logik ================= */
let armedFlag = null;   // Merkmal für die nächste Zählung
let selSize  = null;    // gewählte Größe (Seite 1 -> Seite 2)

function addCount(typeId, sizeId){
  const sub = curSub();
  const k = typeId + "|" + sizeId + "|" + (armedFlag||"");
  sub.counts[k] = (sub.counts[k]||0) + 1;
  sub.log.push(k);
  if(sub.log.length > 3000) sub.log.shift();
  armedFlag = null;
  save();
  if(navigator.vibrate) navigator.vibrate(25);
}
function undo(){
  const sub = curSub();
  const k = sub.log.pop();
  if(!k) return;
  if(sub.counts[k]) sub.counts[k]--;
  if(sub.counts[k]===0) delete sub.counts[k];
  save(); render();
}
function adjust(sub, k, delta){
  sub.counts[k] = Math.max(0,(sub.counts[k]||0) + delta);
  if(sub.counts[k]===0) delete sub.counts[k];
  save(); render();
}
function subTotal(sub){ return Object.values(sub.counts).reduce((a,b)=>a+b,0); }
function sizeTotalInSub(sub, sizeId){
  let n=0; for(const k in sub.counts){ if(k.split("|")[1]===sizeId) n += sub.counts[k]; }
  return n;
}
function typeSizeTotalInSub(sub, typeId, sizeId){
  let n=0; for(const k in sub.counts){ const p=k.split("|"); if(p[0]===typeId && p[1]===sizeId) n += sub.counts[k]; }
  return n;
}
function flagTotalInSub(sub, flagId){
  let n=0; for(const k in sub.counts){ if(k.split("|")[2]===flagId) n += sub.counts[k]; }
  return n;
}

/* ================= Ansichten ================= */
const app = document.getElementById("app");
let view = "count";     // count (Größen) | sizemenu | type | report | settings
let reportFieldId = null;

function setView(v){ view=v; render(); }
document.getElementById("tabCount").onclick    = ()=>{ selSize=null; setView("count"); };
document.getElementById("tabReport").onclick   = ()=>{ reportFieldId = S.activeField; setView("report"); };
document.getElementById("tabSettings").onclick = ()=>setView("settings");

function render(){
  ["tabCount","tabReport","tabSettings"].forEach(id=>document.getElementById(id).classList.remove("active"));
  if(view==="count"||view==="sizemenu"||view==="type") document.getElementById("tabCount").classList.add("active");
  if(view==="report") document.getElementById("tabReport").classList.add("active");
  if(view==="settings") document.getElementById("tabSettings").classList.add("active");
  if(view==="count") renderCount();
  else if(view==="sizemenu") renderSizeMenu();
  else if(view==="type") renderTypePage();
  else if(view==="report") renderReport();
  else renderSettings();
}

function keyText(k){
  const p = k.split("|");
  const t = findType(p[0]), s = findSizeG(p[1]), fl = p[2] ? findFlag(p[2]) : null;
  return (s?esc(s.label):"?") + " · " + (t?esc(t.name):"?") + (fl ? " · " + esc(fl.name) : "");
}
function lastEntryText(sub){
  const k = sub.log[sub.log.length-1];
  if(!k) return "Noch kein Eintrag in diesem Bereich";
  return "Zuletzt: <b>" + keyText(k) + "</b>";
}
function flagCellHTML(fid, sub){
  const fl = findFlag(fid);
  if(!fl) return '<div class="tile emptycell"></div>';
  const armed = armedFlag===fl.id;
  const dis = armedFlag && armedFlag!==fl.id;
  return `<button class="tile flagtile ${armed?"armed":""}" ${dis?'style="opacity:.3;pointer-events:none;background:'+fl.color+'"':'style="background:'+fl.color+'"'} data-flag="${fl.id}">
    <span class="tcount">${flagTotalInSub(sub, fl.id)}</span>
    <span class="tname">${esc(fl.name)}</span>
    <span class="tsub">${armed ? "✓ aktiv" : "Merkmal für nächste Zählung"}</span>
  </button>`;
}

/* ---------- Seite 1: Größen ---------- */
function sizeCellHTML(ref, sub){
  if(!ref) return '<div class="tile emptycell"></div>';
  if(ref==="menu"){
    const extras = S.sizes.filter(x=>x.extra);
    return `<button class="tile menutile" data-menu="1">
      <span class="tname" style="font-size:clamp(16px,4.8vw,22px);">📂 Mehr…</span>
      <span class="tsub">${extras.length} weitere Größen</span>
    </button>`;
  }
  if(ref.indexOf("s:")===0){
    const g = findSizeG(ref.slice(2));
    if(!g) return '<div class="tile emptycell"></div>';
    return `<button class="tile" data-size="${g.id}" style="${tileStyle(g.color, g.img)}">
      <span class="tcount">${sizeTotalInSub(sub, g.id)}</span>
      <span class="tname">${esc(g.label)}</span>
    </button>`;
  }
  if(ref.indexOf("f:")===0) return flagCellHTML(ref.slice(2), sub);
  return '<div class="tile emptycell"></div>';
}
function renderCount(){
  const f = curField(), sub = curSub();
  const rowsCSS = S.layoutSizes.map(r=>r.h==="half"?"0.52fr":"1fr").join(" ");
  app.innerHTML = `
    <header>
      <div class="ctx">
        <select id="selField">${S.fields.map(x=>`<option value="${x.id}" ${x.id===f.id?"selected":""}>📍 ${esc(x.name)}</option>`).join("")}</select>
        <select id="selSub">${f.subs.map(x=>`<option value="${x.id}" ${x.id===sub.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
      </div>
    </header>
    <div class="undobar">
      <div class="last">${lastEntryText(sub)} &nbsp;·&nbsp; Gesamt: <b>${subTotal(sub)}</b></div>
      <button id="btnUndo" ${sub.log.length? "":"disabled"}>↩︎ Rückgängig</button>
    </div>
    <div class="grid" style="grid-template-rows:${rowsCSS}">
      ${S.layoutSizes.map(r=>sizeCellHTML(r.cells[0],sub)+sizeCellHTML(r.cells[1],sub)).join("")}
    </div>`;
  document.getElementById("selField").onchange = e=>{ S.activeField=e.target.value; ensureActiveSub(); armedFlag=null; save(); render(); };
  document.getElementById("selSub").onchange   = e=>{ S.activeSub=e.target.value; armedFlag=null; save(); render(); };
  document.getElementById("btnUndo").onclick   = undo;
  wireCountButtons();
}
function wireCountButtons(){
  app.querySelectorAll(".tile[data-size]").forEach(btn=>{
    btn.onclick = ()=>{ selSize = btn.dataset.size; setView("type"); };
  });
  app.querySelectorAll(".tile[data-menu]").forEach(btn=>{
    btn.onclick = ()=>setView("sizemenu");
  });
  app.querySelectorAll(".tile[data-flag]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.flag;
      armedFlag = (armedFlag===id) ? null : id;
      render();
    };
  });
}

/* ---------- Seite 2: Typen ---------- */
function typeCellHTML(ref, sub){
  if(!ref) return '<div class="tile emptycell"></div>';
  if(ref.indexOf("t:")===0){
    const t = findType(ref.slice(2));
    if(!t) return '<div class="tile emptycell"></div>';
    return `<button class="tile" data-type="${t.id}" style="${tileStyle(t.color, t.img)}">
      <span class="tcount">${typeSizeTotalInSub(sub, t.id, selSize)}</span>
      <span class="tname">${esc(t.name)}</span>
    </button>`;
  }
  if(ref.indexOf("f:")===0) return flagCellHTML(ref.slice(2), sub);
  return '<div class="tile emptycell"></div>';
}
function renderTypePage(){
  const g = findSizeG(selSize);
  if(!g){ setView("count"); return; }
  const sub = curSub();
  const fl = armedFlag ? findFlag(armedFlag) : null;
  const rowsCSS = S.layoutTypes.map(r=>r.h==="half"?"0.52fr":"1fr").join(" ");
  app.innerHTML = `
    <div class="sizehead" style="${tileStyle(g.color, g.img)}">${esc(g.label)} – Typ wählen${fl?` · <span class="fbadge" style="background:${fl.color}">${esc(fl.name)}</span>`:""}</div>
    <div class="grid" style="grid-template-rows:${rowsCSS}">
      ${S.layoutTypes.map(r=>typeCellHTML(r.cells[0],sub)+typeCellHTML(r.cells[1],sub)).join("")}
    </div>
    <button class="backbtn" id="btnBack">✕ Abbrechen (zurück ohne Speichern)</button>`;
  app.querySelectorAll(".tile[data-type]").forEach(btn=>{
    btn.onclick = ()=>{
      addCount(btn.dataset.type, selSize);
      selSize = null;
      setView("count");
    };
  });
  app.querySelectorAll(".tile[data-flag]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.flag;
      armedFlag = (armedFlag===id) ? null : id;
      render();
    };
  });
  document.getElementById("btnBack").onclick = ()=>{ selSize=null; setView("count"); };
}

/* ---------- Bericht ---------- */
function allCountRows(counts){
  const rows = [];
  for(const k in counts){
    const n = counts[k]; if(!(n>0)) continue;
    const p = k.split("|");
    const t = findType(p[0]); if(!t) continue;
    const s = findSizeG(p[1]); if(!s) continue;
    rows.push({t, s, fid:p[2]||"", n, k});
  }
  const fi = r=>{ if(!r.fid) return -1; const i=S.flags.findIndex(f=>f.id===r.fid); return i<0?99:i; };
  rows.sort((a,b)=>
    (S.sizes.indexOf(a.s)-S.sizes.indexOf(b.s)) ||
    (S.types.indexOf(a.t)-S.types.indexOf(b.t)) ||
    (fi(a)-fi(b))
  );
  return rows;
}
function flagName(fid){ if(!fid) return ""; const f=findFlag(fid); return f?f.name:"(Merkmal gelöscht)"; }
function renderReport(){
  if(!reportFieldId || !S.fields.find(f=>f.id===reportFieldId)) reportFieldId = S.activeField;
  const f = S.fields.find(f=>f.id===reportFieldId);
  const fieldAgg = {};
  f.subs.forEach(sub=>{ for(const k in sub.counts) fieldAgg[k]=(fieldAgg[k]||0)+sub.counts[k]; });
  const fieldTotal = Object.values(fieldAgg).reduce((a,b)=>a+b,0);

  let html = `
    <div class="page">
      <div class="row">
        <select id="repField" class="grow" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:16px;font-weight:600;padding:10px;">
          ${S.fields.map(x=>`<option value="${x.id}" ${x.id===f.id?"selected":""}>📍 ${esc(x.name)}</option>`).join("")}
        </select>
      </div>
      <div class="card">
        <h2 style="margin-top:0;">Gesamt: ${esc(f.name)} — <span style="color:var(--accent)">${fieldTotal} Bäume</span></h2>
        ${fieldTotal? tableHTML(fieldAgg) : '<div class="muted">Noch keine Zählungen auf diesem Feld.</div>'}
      </div>`;

  f.subs.forEach(sub=>{
    const rows = allCountRows(sub.counts);
    html += `<div class="card">
      <h2 style="margin-top:0;">${esc(sub.name)} — ${subTotal(sub)} Bäume</h2>
      ${rows.length? `<table><tr><th>Größe</th><th>Qualität</th><th>Merkmal</th><th style="text-align:right">Anzahl</th><th></th></tr>
        ${rows.map(r=>`<tr>
          <td>${esc(r.s.label)}</td>
          <td><span class="dot" style="background:${r.t.color}"></span>${esc(r.t.name)}</td>
          <td>${r.fid?`<span class="fbadge" style="background:${(findFlag(r.fid)||{}).color||'#666'}">${esc(flagName(r.fid))}</span>`:""}</td>
          <td class="num">${r.n}</td>
          <td style="text-align:right"><span class="corr">
            <button data-sub="${sub.id}" data-k="${r.k}" data-d="-1">−</button>
            <button data-sub="${sub.id}" data-k="${r.k}" data-d="1">+</button>
          </span></td>
        </tr>`).join("")}</table>`
      : '<div class="muted">Keine Einträge.</div>'}
    </div>`;
  });

  html += `
      <button class="btn primary wide" id="btnCsvField">⬇️ Excel-Export: nur „${esc(f.name)}“</button>
      <button class="btn wide" id="btnCsvAll">⬇️ Excel-Export: alle Felder</button>
      <p class="muted">CSV-Spalten: Feld; Unterbereich; Größe; Qualität; Merkmal; Anzahl. Merkmal ist leer bei normalen Zählungen.</p>
    </div>`;
  app.innerHTML = html;

  document.getElementById("repField").onchange = e=>{ reportFieldId=e.target.value; render(); };
  app.querySelectorAll(".corr button").forEach(b=>{
    b.onclick = ()=>{
      const sub = f.subs.find(s=>s.id===b.dataset.sub);
      adjust(sub, b.dataset.k, +b.dataset.d);
    };
  });
  document.getElementById("btnCsvField").onclick = ()=>exportCSV([f]);
  document.getElementById("btnCsvAll").onclick   = ()=>exportCSV(S.fields);
}
function tableHTML(agg){
  const rows = allCountRows(agg);
  return `<table><tr><th>Größe</th><th>Qualität</th><th>Merkmal</th><th style="text-align:right">Anzahl</th></tr>
    ${rows.map(r=>`<tr>
      <td>${esc(r.s.label)}</td>
      <td><span class="dot" style="background:${r.t.color}"></span>${esc(r.t.name)}</td>
      <td>${r.fid?`<span class="fbadge" style="background:${(findFlag(r.fid)||{}).color||'#666'}">${esc(flagName(r.fid))}</span>`:""}</td>
      <td class="num">${r.n}</td>
    </tr>`).join("")}</table>`;
}
function exportCSV(fields){
  let csv = "\uFEFFFeld;Unterbereich;Größe;Qualität;Merkmal;Anzahl\r\n";
  fields.forEach(f=>{
    f.subs.forEach(sub=>{
      allCountRows(sub.counts).forEach(r=>{
        csv += [f.name, sub.name, r.s.label, r.t.name, flagName(r.fid), r.n]
          .map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")+"\r\n";
      });
    });
  });
  const date = new Date().toISOString().slice(0,10);
  const name = (fields.length===1 ? "Zaehlung_"+fields[0].name.replace(/[^\wäöüÄÖÜß-]+/g,"_") : "Zaehlung_alle_Felder") + "_" + date + ".csv";
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

  return html;

function cellOptionsTypes(sel){

  html += `<button class="btn wide" data-act="addF">＋ Neues Feld anlegen</button></div>

    <div class="card">
      <h2 style="margin-top:0;">🛟 Datensicherung</h2>
      <p class="muted">Alle Daten liegen lokal auf diesem Handy. Vor dem Löschen von Browser-/Websitedaten: erst CSV exportieren oder Sicherung erstellen.</p>
      <button class="btn wide" id="btnBackup">⬇️ Sicherungsdatei erstellen</button>
      <button class="btn wide" id="btnRestore">⬆️ Sicherung wiederherstellen</button>
      <input type="file" id="fileRestore" accept=".json,application/json" class="hidden">
      <button class="btn wide danger" id="btnReset">Alle Zählungen löschen…</button>
    </div>
  </div>`;
  app.innerHTML = html;

  /* Layout-Editoren */
  app.querySelectorAll("[data-lay]").forEach(el=>{
    const which = el.dataset.w;
    const lay = ()=> which==="S" ? S.layoutSizes : S.layoutTypes;
    const kind = el.dataset.lay;
    if(kind==="cell"){
      el.onchange = ()=>{ lay()[+el.dataset.i].cells[+el.dataset.c] = el.value || null; save(); };
      return;
    }
    el.onclick = ()=>{
      const L = lay(); const i = +el.dataset.i;
      if(kind==="h"){ L[i].h = (L[i].h==="half" ? "full" : "half"); }
      if(kind==="up" && i>0){ const x=L[i]; L[i]=L[i-1]; L[i-1]=x; }
      if(kind==="dn" && i<L.length-1){ const x=L[i]; L[i]=L[i+1]; L[i+1]=x; }
      if(kind==="del"){ if(L.length<=1) return; L.splice(i,1); }
      if(kind==="add"){ L.push({h:"full", cells:[null,null]}); }
      save(); render();
    };
  });

  /* Aktionen */
  app.querySelectorAll("[data-act]").forEach(el=>{
    const act = el.dataset.act;
    const getF  = ()=>S.fields.find(x=>x.id===el.dataset.f);
    const getT  = ()=>findType(el.dataset.t);
    const getG  = ()=>findSizeG(el.dataset.g);
    const getFl = ()=>findFlag(el.dataset.fl);

    if(act==="colT"){ el.onchange = ()=>{ getT().color = el.value; save(); render(); }; return; }
    if(act==="colG"){ el.onchange = ()=>{ getG().color = el.value; save(); render(); }; return; }
    if(act==="colFl"){ el.onchange = ()=>{ getFl().color = el.value; save(); render(); }; return; }

    el.onclick = async ()=>{
      /* --- Größen --- */
      if(act==="addG"){
        const n = await askText("Neue Größe (z. B. 2 – 2,5 m):", "");
        if(n){ S.sizes.push({id:uid(), label:n, color:null, img:null, extra:true}); save(); render(); }
      }
      if(act==="renG"){
        const g=getG(); const n = await askText("Größe umbenennen:", g.label);
        if(n){ g.label=n; save(); render(); }
      }
      if(act==="movG"){
        const g=getG();
        if(await moveInArray(S.sizes, S.sizes.indexOf(g), "„"+g.label+"“ verschieben")){ save(); render(); }
      }
      if(act==="extraG"){
        const g=getG(); g.extra = !g.extra;
        if(g.extra){ S.layoutSizes.forEach(r=>{ r.cells = r.cells.map(c=>c==="s:"+g.id ? null : c); }); }
        save(); render();
      }
      if(act==="imgG"){
        const g=getG();
        if(g.img){
          const c = await askChoice("Bild für Größe „"+g.label+"“", ["Neues Foto wählen","Bild entfernen (Farbe verwenden)"]);
          if(c===1){ g.img=null; save(); render(); return; }
          if(c!==0) return;
        }
        const d = await pickImage();
        if(d){ g.img=d; save(); render(); }
      }
      if(act==="delG"){
        const g=getG();
        if(S.sizes.length<=1){ await askConfirm("Mindestens eine Größe muss bestehen bleiben.","Verstanden"); return; }
        let n=0;
        S.fields.forEach(f=>f.subs.forEach(sub=>{
          for(const k in sub.counts){ if(k.split("|")[1]===g.id) n += sub.counts[k]; }
        }));
        if(await askConfirm(`Größe „${g.label}“ löschen? ${n} vorhandene Zählungen dieser Größe werden mitgelöscht.`, "Löschen", true)){
          S.sizes = S.sizes.filter(x=>x.id!==g.id);
          S.layoutSizes.forEach(r=>{ r.cells = r.cells.map(c=>c==="s:"+g.id ? null : c); });
          S.fields.forEach(f=>f.subs.forEach(sub=>{
            for(const k in sub.counts){ if(k.split("|")[1]===g.id) delete sub.counts[k]; }
            sub.log = sub.log.filter(k=>k.split("|")[1]!==g.id);
          }));
          save(); render();
        }
      }
      /* --- Typen --- */
      if(act==="addT"){
        const n = await askText("Name des neuen Typs:", "");
        if(n){ S.types.push({id:uid(), name:n, color:"#3a6d4f", img:null}); save(); render(); }
      }
      if(act==="renT"){
        const t = getT(); const n = await askText("Typ-Name:", t.name);
        if(n){ t.name=n; save(); render(); }
      }
      if(act==="movT"){
        const t=getT();
        if(await moveInArray(S.types, S.types.indexOf(t), "„"+t.name+"“ verschieben")){ save(); render(); }
      }
      if(act==="imgT"){
        const t = getT();
        if(t.img){
          const c = await askChoice("Foto für „"+t.name+"“", ["Neues Foto wählen","Foto entfernen (Farbe verwenden)"]);
          if(c===1){ t.img=null; save(); render(); return; }
          if(c!==0) return;
        }
        const d = await pickImage();
        if(d){ t.img=d; save(); render(); }
      }
      if(act==="delT"){
        const t=getT();
        if(S.types.length<=1){ await askConfirm("Mindestens ein Typ muss bestehen bleiben.","Verstanden"); return; }
        let n=0;
        S.fields.forEach(f=>f.subs.forEach(sub=>{
          for(const k in sub.counts){ if(k.split("|")[0]===t.id) n += sub.counts[k]; }
        }));
        if(await askConfirm(`Typ „${t.name}“ löschen? ${n} vorhandene Zählungen dieses Typs werden mitgelöscht.`, "Löschen", true)){
          S.types = S.types.filter(x=>x.id!==t.id);
          S.layoutTypes.forEach(r=>{ r.cells = r.cells.map(c=>c==="t:"+t.id ? null : c); });
          S.fields.forEach(f=>f.subs.forEach(sub=>{
            for(const k in sub.counts){ if(k.split("|")[0]===t.id) delete sub.counts[k]; }
            sub.log = sub.log.filter(k=>k.split("|")[0]!==t.id);
          }));
          save(); render();
        }
      }
      /* --- Merkmale --- */
      if(act==="renFl"){
        const fl = getFl(); const n = await askText("Merkmal umbenennen:", fl.name);
        if(n){ fl.name=n; save(); render(); }
      }
      if(act==="addFl"){
        const n = await askText("Name des neuen Merkmals:", "");
        if(n){ S.flags.push({id:uid(), name:n, color:"#555f5b"}); save(); render(); }
      }
      if(act==="delFl"){
        const fl = getFl();
        let n=0;
        S.fields.forEach(f=>f.subs.forEach(sub=>{
          for(const k in sub.counts){ if(k.split("|")[2]===fl.id) n += sub.counts[k]; }
        }));
        if(await askConfirm(`Merkmal „${fl.name}“ löschen?${n?` ${n} damit markierte Zählungen bleiben erhalten und werden zu normalen Zählungen (ohne Merkmal).`:""}`, "Löschen", true)){
          S.fields.forEach(f=>f.subs.forEach(sub=>{
            for(const k in Object.assign({}, sub.counts)){
              const p = k.split("|");
              if(p[2]===fl.id){
                const nk = p[0]+"|"+p[1]+"|";
                sub.counts[nk] = (sub.counts[nk]||0) + sub.counts[k];
                delete sub.counts[k];
              }
            }
            sub.log = sub.log.map(k=>{
              const p = k.split("|");
              return p[2]===fl.id ? p[0]+"|"+p[1]+"|" : k;
            });
          }));
          S.flags = S.flags.filter(x=>x.id!==fl.id);
          S.layoutSizes.forEach(r=>{ r.cells = r.cells.map(c=>c==="f:"+fl.id ? null : c); });
          S.layoutTypes.forEach(r=>{ r.cells = r.cells.map(c=>c==="f:"+fl.id ? null : c); });
          if(armedFlag===fl.id) armedFlag=null;
          save(); render();
        }
      }
      /* --- Felder --- */
      if(act==="addF"){
        const n = await askText("Name des neuen Feldes:", "Feld "+(S.fields.length+1));
        if(n){ S.fields.push({id:uid(), name:n, subs:[{id:uid(), name:"Bereich A", counts:{}, log:[]}]}); save(); render(); }
      }
      if(act==="renF"){
        const f = getF(); const n = await askText("Feld umbenennen:", f.name);
        if(n){ f.name=n; save(); render(); }
      }
      if(act==="delF"){
        const f = getF();
        if(S.fields.length<=1){ await askConfirm("Mindestens ein Feld muss bestehen bleiben.","Verstanden"); return; }
        const total = f.subs.reduce((a,s)=>a+subTotal(s),0);
        if(await askConfirm(`Feld „${f.name}“ mit ${total} Zählungen wirklich löschen?`, "Löschen", true)){
          S.fields = S.fields.filter(x=>x.id!==f.id);
          if(S.activeField===f.id){ S.activeField=S.fields[0].id; ensureActiveSub(); }
          save(); render();
        }
      }
      if(act==="addS"){
        const f = getF();
        const n = await askText("Name des Unterbereichs:", "Bereich "+String.fromCharCode(65+f.subs.length));
        if(n){ f.subs.push({id:uid(), name:n, counts:{}, log:[]}); save(); render(); }
      }
      if(act==="renS" || act==="delS"){
        const f = getF(); const sub = f.subs.find(x=>x.id===el.dataset.s);
        if(act==="renS"){
          const n = await askText("Unterbereich umbenennen:", sub.name);
          if(n){ sub.name=n; save(); render(); }
        } else {
          if(f.subs.length<=1){ await askConfirm("Jedes Feld braucht mindestens einen Unterbereich.","Verstanden"); return; }
          if(await askConfirm(`„${sub.name}“ mit ${subTotal(sub)} Zählungen wirklich löschen?`, "Löschen", true)){
            f.subs = f.subs.filter(x=>x.id!==sub.id);
            if(S.activeSub===sub.id) ensureActiveSub();
            save(); render();
          }
        }
      }
    };
  });

  document.getElementById("btnBackup").onclick = ()=>{
    const blob = new Blob([JSON.stringify(S)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Baumzaehler_Sicherung_" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  };
  document.getElementById("btnRestore").onclick = ()=>document.getElementById("fileRestore").click();
  document.getElementById("fileRestore").onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = async ()=>{
      try{
        const s = JSON.parse(r.result);
        if(!s.fields) throw 0;
        if(await askConfirm("Aktuelle Daten durch die Sicherung ersetzen?", "Wiederherstellen", true)){
          S = normalize(s); ensureActiveSub(); save(); render();
        }
      }catch(_){ await askConfirm("Datei konnte nicht gelesen werden.","Verstanden"); }
    };
    r.readAsText(file);
  };
  document.getElementById("btnReset").onclick = async ()=>{
    if(await askConfirm("Wirklich ALLE Zählungen in ALLEN Feldern auf 0 setzen? Felder, Größen, Typen, Layout und Fotos bleiben erhalten.", "Weiter", true)){
      if(await askConfirm("Letzte Sicherheitsfrage: Zählungen unwiderruflich löschen?", "Ja, alles löschen", true)){
        S.fields.forEach(f=>f.subs.forEach(s=>{ s.counts={}; s.log=[]; }));
        save(); render();
      }
    }
  };
}

render();

/* Offline-Fähigkeit */
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
</body>
</html>
