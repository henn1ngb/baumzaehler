<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baumzähler">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Baumzähler</title>
<style>
  :root{
    --bg:#1a2421; --panel:#243430; --panel2:#2e423c; --line:#3a524a;
    --text:#f2f7f4; --muted:#9db8ae; --accent:#ffd23f; --danger:#e05252;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{flex:1; display:flex; flex-direction:column; min-height:0;}

  header{padding:10px 12px 6px;}
  .ctx{display:flex; gap:8px;}
  .ctx select{
    flex:1; min-width:0; background:var(--panel); color:var(--text);
    border:1px solid var(--line); border-radius:10px;
    font-size:16px; font-weight:600; padding:10px 8px; appearance:none;
  }
  .undobar{
    margin:6px 12px 0; padding:10px 12px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; gap:10px; min-height:46px;
  }
  .undobar .last{flex:1; font-size:14px; color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .undobar .last b{color:var(--text);}
  .undobar button{
    background:var(--panel2); color:var(--accent); border:1px solid var(--line);
    border-radius:8px; font-size:14px; font-weight:700; padding:8px 12px;
  }
  .undobar button:disabled{opacity:.35;}

  .grid{
    flex:1; min-height:0; display:grid; gap:10px; padding:10px 12px 12px;
    grid-template-columns:1fr 1fr;
  }
  .tile{
    border:none; border-radius:var(--radius); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-weight:800; padding:6px; position:relative; overflow:hidden;
    box-shadow:0 3px 0 rgba(0,0,0,.35);
  }
  .tile:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.35);}
  .tile .tname{font-size:clamp(18px,5.2vw,27px); line-height:1.1; text-shadow:0 1px 4px rgba(0,0,0,.6); text-align:center;}
  .tile .tsub{font-size:12px; font-weight:600; opacity:.9; margin-top:3px; text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .tile .tcount{
    position:absolute; top:5px; right:8px; font-size:13px; font-weight:700;
    background:rgba(0,0,0,.38); border-radius:99px; padding:2px 8px;
  }
  .tile.flagtile{box-shadow:inset 0 0 0 2px rgba(255,255,255,.18), 0 3px 0 rgba(0,0,0,.35);}
  .tile.flagtile .tname{font-size:clamp(16px,4.8vw,22px);}
  .tile.armed{outline:4px solid var(--accent); outline-offset:-4px;}
  .tile.menutile{background:var(--panel); border:2px dashed var(--line); color:var(--text); box-shadow:none;}
  .tile.emptycell{background:transparent; box-shadow:none; pointer-events:none;}
  @media (prefers-reduced-motion: reduce){ .tile:active{transform:none;} }

  .sizehead{
    margin:10px 12px 0; padding:14px; border-radius:var(--radius);
    font-size:19px; font-weight:800; color:#fff; text-align:center; text-shadow:0 1px 4px rgba(0,0,0,.55);
  }
  .backbtn{
    margin:0 12px 12px; padding:16px; border-radius:var(--radius);
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    font-size:17px; font-weight:700;
  }

  .page{flex:1; min-height:0; overflow-y:auto; padding:12px; -webkit-overflow-scrolling:touch;}
  .page h2{font-size:18px; margin:14px 0 8px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{text-align:left; padding:7px 3px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
  td.num{text-align:right; font-variant-numeric:tabular-nums; font-weight:700;}
  .dot{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px;}
  .row{display:flex; gap:7px; align-items:center; margin-bottom:8px; flex-wrap:nowrap;}
  .row .grow{flex:1; min-width:0; overflow:hidden;}
  .btn{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; font-size:15px; font-weight:700; padding:12px 14px;
  }
  .btn.primary{background:var(--accent); color:#1a2421; border-color:var(--accent);}
  .btn.danger{color:var(--danger);}
  .btn.small{padding:8px 10px; font-size:14px; min-width:38px;}
  .btn.tiny{padding:8px 6px; font-size:14px; min-width:32px;}
  .btn.wide{width:100%; margin-top:6px;}
  .muted{color:var(--muted); font-size:13px; line-height:1.4;}
  .corr{display:inline-flex; gap:6px;}
  .corr button{width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:17px; font-weight:800;}
  input[type=text]{background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:11px; font-size:16px; width:100%;}
  input[type=color]{border:1px solid var(--line); background:var(--panel2); border-radius:8px; width:40px; height:38px; padding:2px; flex:none;}
  select.mini{background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 6px; font-size:14px; font-weight:600; min-width:0;}
  .thumb{width:38px; height:38px; border-radius:8px; background-size:cover; background-position:center; flex:none; border:1px solid var(--line);}
  .badge{font-size:11px; background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:2px 6px; color:var(--muted); margin-left:5px; vertical-align:middle; white-space:nowrap;}
  .fbadge{font-size:11px; border-radius:6px; padding:2px 6px; color:#fff; margin-left:5px; vertical-align:middle; white-space:nowrap;}
  .warn{background:#5a3a16; border:1px solid #a9762d; color:#ffd9a0; border-radius:10px; padding:10px 12px; margin:10px 12px 0; font-size:13px; line-height:1.4;}
  .hidden{display:none !important;}
  footer.tabs{display:flex; border-top:1px solid var(--line); background:var(--panel);}
  footer.tabs button{
    flex:1; background:none; border:none; color:var(--muted);
    font-size:13px; font-weight:700; padding:11px 3px 13px;
  }
  footer.tabs button.active{color:var(--accent);}

  /* Kundenliste beim Etikettieren */
  .custbtn{
    width:100%; text-align:left; margin-bottom:8px; padding:11px;
    display:flex; align-items:center; gap:11px;
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:12px; font-weight:700;
  }
  .custbtn:active{transform:translateY(1px);}
  .custbtn .swatch{width:34px; height:34px; border-radius:8px; flex:none; border:1px solid var(--line); background-size:cover; background-position:center;}
  .custbtn .cname{display:block; font-size:17px;}
  .custbtn .cfields{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-top:2px; white-space:normal;}
  .custbtn .cnum{display:block; font-size:17px; font-variant-numeric:tabular-nums;}
  .custbtn .crest{display:block; font-size:11px; font-weight:600; color:var(--muted);}
  .custbtn.done{opacity:.6;}
  .custbtn.gleich{background:var(--accent); color:#1a2421; border-color:var(--accent);}
  .custbtn.gleich .cfields, .custbtn.gleich .crest{color:#3a4a2e;}

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px; width:100%; max-width:380px; max-height:80vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 12px; font-size:17px;}
  .modal p{margin:0 0 14px; font-size:15px; line-height:1.45; color:var(--text); user-select:text;}
  .mbtns{display:flex; gap:8px; margin-top:14px;}
  .mbtns .btn{flex:1;}
  .mlist .btn{width:100%; margin-bottom:8px; text-align:left;}
</style>
</head>
<body>
<div id="storageWarn" class="warn hidden">
  ⚠️ Dauerhaftes Speichern ist hier nicht möglich. Bitte die App <b>im Browser bzw. über das Home-Bildschirm-Icon öffnen</b> – sonst gehen Daten beim Schließen verloren.
</div>
<div id="app"></div>
<footer class="tabs">
  <button id="tabLabel">🏷️ Etikett</button>
  <button id="tabCount">🌲 Zählen</button>
  <button id="tabReport">📊 Bericht</button>
  <button id="tabSettings">⚙️ Verwalten</button>
</footer>

/* ================= Dialoge ================= */
function buildOverlay(inner){
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = '<div class="modal">'+inner+'</div>';
  document.body.appendChild(ov);
  return ov;
}
function askText(title, value){
  return new Promise(res=>{
    const ov = buildOverlay('<h3>'+esc(title)+'</h3><input type="text" id="mIn"><div class="mbtns"><button class="btn" id="mC">Abbrechen</button><button class="btn primary" id="mO">OK</button></div>');
    const inp = ov.querySelector("#mIn"); inp.value = value||""; setTimeout(()=>{ inp.focus(); inp.select(); }, 60);
    const done = v=>{ ov.remove(); res(v); };
    ov.querySelector("#mO").onclick = ()=>done(inp.value.trim()||null);
    inp.onkeydown = e=>{ if(e.key==="Enter") done(inp.value.trim()||null); };
    ov.querySelector("#mC").onclick = ()=>done(null);
  });
}
function askConfirm(text, okLabel, danger){
  return new Promise(res=>{
    const ov = buildOverlay('<h3>Bestätigen</h3><p>'+esc(text)+'</p><div class="mbtns"><button class="btn" id="mC">Abbrechen</button><button class="btn '+(danger?'danger':'primary')+'" id="mO">'+esc(okLabel||"OK")+'</button></div>');
    ov.querySelector("#mO").onclick = ()=>{ ov.remove(); res(true); };
    ov.querySelector("#mC").onclick = ()=>{ ov.remove(); res(false); };
  });
}
function askChoice(title, options){
  return new Promise(res=>{
    const ov = buildOverlay('<h3>'+esc(title)+'</h3><div class="mlist">'+options.map((o,i)=>'<button class="btn" data-i="'+i+'">'+esc(o)+'</button>').join("")+'</div><div class="mbtns"><button class="btn" id="mC">Abbrechen</button></div>');
    ov.querySelectorAll(".mlist .btn").forEach(b=>b.onclick=()=>{ ov.remove(); res(+b.dataset.i); });
    ov.querySelector("#mC").onclick = ()=>{ ov.remove(); res(null); };
  });
}
async function moveInArray(arr, idx, title){
  const c = await askChoice(title, ["⬆️ Ganz nach oben","↑ Eine Position hoch","↓ Eine Position runter","⬇️ Ganz nach unten"]);
  if(c===null) return false;
  const item = arr.splice(idx,1)[0];
  let ni = c===0 ? 0 : c===1 ? Math.max(0, idx-1) : c===2 ? Math.min(arr.length, idx+1) : arr.length;
  arr.splice(ni, 0, item);
  return true;
}
function pickImage(){
  return new Promise(res=>{
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.onchange = ()=>{
      const f = inp.files && inp.files[0];
      if(!f){ res(null); return; }
      const r = new FileReader();
      r.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          try{
            const max = 480;
            const sc = Math.min(1, max/Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = Math.max(1, Math.round(img.width*sc));
            c.height = Math.max(1, Math.round(img.height*sc));
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            res(c.toDataURL("image/jpeg", 0.7));
          }catch(e){ res(null); }
        };
        img.onerror = ()=>res(null);
        img.src = r.result;
      };
      r.onerror = ()=>res(null);
      r.readAsDataURL(f);
    };
    inp.click();
  });
}

/* ---- Migration: v4 (Typ + Größe getrennt) -> v5 (kombinierte Kategorien) ---- */
function migrateV4(o){
  const s = defaultState();
  if(o.flags && o.flags.length) s.flags = o.flags;
  if(o.customers && o.customers.length){
    s.customers = o.customers.filter(c=>!c.own).map(c=>({id:c.id, name:c.name, color:c.color, img:c.img||null}));
    const own = o.customers.find(c=>c.own);
    if(own) s.gleich = {name:"Gleich (System)", color:own.color||"#ffd23f"};
  }
  // Kategorien aus vorhandenen Kombinationen bilden
  const cats = []; const map = {};   // "typId|größenId" -> katId
  const used = {};
  (o.fields||[]).forEach(f=>(f.subs||[]).forEach(sub=>{
    for(const k in (sub.counts||{})){ const p=k.split("|"); used[p[0]+"|"+p[1]]=true; }
    for(const k in (sub.labels||{})){ const p=k.split("|"); used[p[0]+"|"+p[1]]=true; }
  }));
  (o.types||[]).forEach(t=>{
    (o.sizes||[]).forEach(g=>{
      const key = t.id+"|"+g.id;
      if(!used[key]) return;
      const c = cat(t.name+" "+g.label, g.color||t.color, g.img||t.img||null, true);
      cats.push(c); map[key] = c.id;
    });
  });
  if(cats.length){
    // Standardkategorien behalten, migrierte anhängen (im Mehr-Menü)
    s.cats = s.cats.concat(cats);
  }
  // Bestellungen umschlüsseln (alt: kunde|typ|größe)
  s.orders = {};
  for(const ok in (o.orders||{})){
    const p = ok.split("|");
    const cid = map[p[1]+"|"+p[2]];
    if(cid) s.orders[p[0]+"|"+cid] = o.orders[ok];
  }
  // Felder, Zählungen, Etiketten
  if(o.fields && o.fields.length){
    s.fields = o.fields.map(f=>({
      id:f.id, name:f.name,
      subs:(f.subs||[]).map(sub=>{
        const counts={}, log=[], labels={}, llog=[];
        for(const k in (sub.counts||{})){
          const p=k.split("|"); const c=map[p[0]+"|"+p[1]]; if(!c) continue;
          const nk=c+"|"+(p[2]||"");
          counts[nk]=(counts[nk]||0)+sub.counts[k];
        }
        (sub.log||[]).forEach(k=>{ const p=k.split("|"); const c=map[p[0]+"|"+p[1]]; if(c) log.push(c+"|"+(p[2]||"")); });
        for(const k in (sub.labels||{})){
          const p=k.split("|"); const c=map[p[0]+"|"+p[1]]; if(!c) continue;
          const own = (o.customers||[]).find(x=>x.id===p[2] && x.own);
          const cust = own ? GLEICH : p[2];
          const nk=c+"|"+cust+"|"+(p[3]||"");
          labels[nk]=(labels[nk]||0)+sub.labels[k];
        }
        (sub.llog||[]).forEach(k=>{
          const p=k.split("|"); const c=map[p[0]+"|"+p[1]]; if(!c) return;
          const own = (o.customers||[]).find(x=>x.id===p[2] && x.own);
          llog.push(c+"|"+(own?GLEICH:p[2])+"|"+(p[3]||""));
        });
        return {id:sub.id, name:sub.name, counts:counts, log:log, labels:labels, llog:llog};
      })
    }));
  }
  s.activeField = o.activeField; s.activeSub = o.activeSub;
  return s;
}
function ensureStructs(s){
  if(!s.customers) s.customers = [];
  if(!s.gleich) s.gleich = {name:"Gleich (System)", color:"#ffd23f"};
  if(!s.orders) s.orders = {};
  (s.fields||[]).forEach(f=>(f.subs||[]).forEach(sub=>{
    if(!sub.counts) sub.counts={}; if(!sub.log) sub.log=[];
    if(!sub.labels) sub.labels={}; if(!sub.llog) sub.llog=[];
  }));
  return s;
}
function normalize(s){
  if(s && s.v===5 && s.cats && s.layout && s.fields) return ensureStructs(s);
  if(s && s.types && s.sizes) return ensureStructs(migrateV4(s));   // v4
  if(s && s.types) {                                                 // v3 und älter: Felder retten
    const d = defaultState();
    if(s.fields && s.fields.length){
      d.fields = s.fields.map(f=>({id:f.id, name:f.name, subs:(f.subs||[]).map(x=>newSub(x.name))}));
    }
    return ensureStructs(d);
  }
  return defaultState();
}
function dataCount(s){
  let n=0;
  (s.fields||[]).forEach(f=>(f.subs||[]).forEach(sub=>{
    for(const k in (sub.counts||{})) n+=sub.counts[k];
    for(const k in (sub.labels||{})) n+=sub.labels[k];
  }));
  return n;
}
function load(){
  if(!storageOK){ if(!memFallback) memFallback = defaultState(); return memFallback; }
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s){
        const cur = normalize(s);
        // Leerer Stand (z. B. nach Browserwechsel/Datenverlust) -> eingebaute Sicherung zurückholen
        if(dataCount(cur)===0){
          const d = defaultState();
          if(dataCount(d)>0) return d;
        }
        return cur;
      }
    }
    for(const ok of OLDKEYS){
      const old = localStorage.getItem(ok);
      if(old){ const o = JSON.parse(old); if(o){ const m = normalize(o); if(dataCount(m)>0) return m; } }
    }
  }catch(e){}
  return defaultState();
}
let S = load();
if(!S.activeField || !S.fields.find(f=>f.id===S.activeField)) S.activeField = S.fields[0].id;
ensureActiveSub();
save();

function ensureActiveSub(){

function save(){

  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ alert("Achtung: Speichern fehlgeschlagen! Möglicherweise zu viele/zu große Fotos."); }
}
function curField(){ return S.fields.find(f=>f.id===S.activeField); }
function curSub(){ return curField().subs.find(s=>s.id===S.activeSub); }
function findCat(cid){ return S.cats.find(x=>x.id===cid); }

/* ================= Logik ================= */
let armedFlag = null;
let selCat = null;

function addCount(catId){
  const sub = curSub();
  const k = catId+"|"+(armedFlag||"");
  sub.counts[k] = (sub.counts[k]||0)+1;
  sub.log.push(k); if(sub.log.length>3000) sub.log.shift();
  armedFlag = null; save();
  if(navigator.vibrate) navigator.vibrate(25);
}
function undoCount(){
  const sub = curSub(); const k = sub.log.pop(); if(!k) return;
  if(sub.counts[k]) sub.counts[k]--;
  if(sub.counts[k]===0) delete sub.counts[k];
  save(); render();
}
function addLabel(catId, custId){
  const sub = curSub();
  const k = catId+"|"+custId+"|"+(armedFlag||"");
  sub.labels[k] = (sub.labels[k]||0)+1;
  sub.llog.push(k); if(sub.llog.length>3000) sub.llog.shift();
  armedFlag = null; save();
  if(navigator.vibrate) navigator.vibrate(25);
}
function undoLabel(){
  const sub = curSub(); const k = (sub.llog||[]).pop(); if(!k) return;
  if(sub.labels[k]) sub.labels[k]--;
  if(sub.labels[k]===0) delete sub.labels[k];
  save(); render();
}
function adjust(sub, k, delta, isLabel){
  const m = isLabel ? sub.labels : sub.counts;
  m[k] = Math.max(0,(m[k]||0)+delta);
  if(m[k]===0) delete m[k];
  save(); render();
}
/* Menge einer Zeile direkt setzen */
async function setQty(sub, k, isLabel){
  const m = isLabel ? sub.labels : sub.counts;
  const cur = m[k]||0;
  const q = await askText("Neue Anzahl (aktuell "+cur+"):", String(cur));
  if(q===null) return;
  const num = parseInt(String(q).replace(/\D/g,""),10);
  if(isNaN(num) || num<0) return;
  const diff = num - cur;
  if(num===0) delete m[k]; else m[k]=num;
  const logArr = isLabel ? sub.llog : sub.log;
  if(diff<0){
    let rem = -diff;
    for(let i=logArr.length-1;i>=0 && rem>0;i--){ if(logArr[i]===k){ logArr.splice(i,1); rem--; } }
  } else { for(let i=0;i<diff;i++) logArr.push(k); }
  save(); render();
}
/* Einträge in einen anderen Feld/Unterbereich verschieben */
async function moveEntries(subFrom, k, isLabel){
  const mFrom = isLabel ? subFrom.labels : subFrom.counts;
  const have = mFrom[k]||0;
  if(!have) return;
  const targets = [];
  S.fields.forEach(f=>f.subs.forEach(s=>{ if(s.id!==subFrom.id) targets.push({f:f, s:s}); }));
  if(!targets.length) return;
  const q = await askText("Wie viele von "+have+" verschieben?", String(have));
  if(q===null) return;
  let num = parseInt(String(q).replace(/\D/g,""),10);
  if(isNaN(num) || num<=0) return;
  num = Math.min(num, have);
  const ti = await askChoice("Wohin verschieben? ("+num+" Stück)", targets.map(t=>t.f.name+" → "+t.s.name));
  if(ti===null) return;
  const dst = targets[ti].s;
  const mTo = isLabel ? dst.labels : dst.counts;
  mFrom[k] = have - num;
  if(mFrom[k]===0) delete mFrom[k];
  mTo[k] = (mTo[k]||0) + num;
  const lFrom = isLabel ? subFrom.llog : subFrom.log;
  const lTo   = isLabel ? dst.llog : dst.log;
  let rem = num;
  for(let i=lFrom.length-1;i>=0 && rem>0;i--){ if(lFrom[i]===k){ lFrom.splice(i,1); lTo.push(k); rem--; } }
  while(rem>0){ lTo.push(k); rem--; }
  save(); render();
}
function subTotal(sub){ return Object.values(sub.counts).reduce((a,b)=>a+b,0); }
function subLabelTotal(sub){ return Object.values(sub.labels||{}).reduce((a,b)=>a+b,0); }
function catTotalInSub(sub, catId){
  let n=0; for(const k in sub.counts){ if(k.split("|")[0]===catId) n+=sub.counts[k]; }
  return n;
}
function labelCatTotalInSub(sub, catId){
  let n=0; for(const k in (sub.labels||{})){ if(k.split("|")[0]===catId) n+=sub.labels[k]; }
  return n;
}
function flagTotalInSub(sub, flagId, isLabel){
  const m = isLabel ? (sub.labels||{}) : sub.counts;
  const idx = isLabel ? 2 : 1;
  let n=0; for(const k in m){ if(k.split("|")[idx]===flagId) n+=m[k]; }
  return n;
}
function orderKey(cid,catId){ return cid+"|"+catId; }
function orderQty(cid,catId){ return S.orders[orderKey(cid,catId)]||0; }
function custProgress(custId, catId){
  let total=0; const byField=[];
  S.fields.forEach(f=>{
    let n=0;
    f.subs.forEach(sub=>{
      for(const k in (sub.labels||{})){
        const p=k.split("|");
        if(p[0]===catId && p[1]===custId) n+=sub.labels[k];
      }
    });
    if(n>0){ total+=n; byField.push({name:f.name, n:n}); }
  });
  return {total:total, byField:byField, target:orderQty(custId,catId)};
}
function custGrandTotal(custId){
  let n=0;
  S.fields.forEach(f=>f.subs.forEach(sub=>{
    for(const k in (sub.labels||{})){ if(k.split("|")[1]===custId) n+=sub.labels[k]; }
  }));
  return n;
}

/* ---------- Bericht ---------- */
function flagName(fid){ if(!fid) return ""; const f=findFlag(fid); return f?f.name:"(gelöscht)"; }
function countRows(counts){
  const rows=[];
  for(const k in counts){
    const n=counts[k]; if(!(n>0)) continue;
    const p=k.split("|"); const c=findCat(p[0]); if(!c) continue;
    rows.push({c:c, fid:p[1]||"", n:n, k:k});
  }
  rows.sort((a,b)=>(S.cats.indexOf(a.c)-S.cats.indexOf(b.c)));
  return rows;
}
function labelRows(labels){
  const rows=[];
  for(const k in (labels||{})){
    const n=labels[k]; if(!(n>0)) continue;
    const p=k.split("|"); const c=findCat(p[0]); if(!c) continue;
    const cu=findCust(p[1]) || {id:p[1], name:"(gelöscht)", color:"#666"};
    rows.push({c:c, cu:cu, fid:p[2]||"", n:n, k:k});
  }
  rows.sort((a,b)=>(S.cats.indexOf(a.c)-S.cats.indexOf(b.c)) || String(a.cu.name).localeCompare(String(b.cu.name)));
  return rows;
}

function customerReportHTML(){

function dl(csv, name){
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function exportLabelCSV(){
  let csv = "\uFEFFEtikett;Kategorie;Feld;Unterbereich;Merkmal;Anzahl;Bestellt\r\n";
  const all = [{id:GLEICH, name:S.gleich.name}].concat(S.customers);
  all.forEach(c=>{
    S.fields.forEach(f=>f.subs.forEach(sub=>{
      labelRows(sub.labels).filter(r=>r.cu.id===c.id).forEach(r=>{
        csv += [c.name, r.c.label, f.name, sub.name, flagName(r.fid), r.n, orderQty(c.id, r.c.id)||""]
          .map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")+"\r\n";
      });
    }));
  });
  dl(csv, "Etiketten_"+new Date().toISOString().slice(0,10)+".csv");
}
function exportCSV(fields){
  let csv = "\uFEFFFeld;Unterbereich;Kategorie;Merkmal;Anzahl\r\n";
  fields.forEach(f=>f.subs.forEach(sub=>{
    countRows(sub.counts).forEach(r=>{
      csv += [f.name, sub.name, r.c.label, flagName(r.fid), r.n]
        .map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")+"\r\n";
    });
  }));
  const nm = (fields.length===1 ? "Zaehlung_"+fields[0].name.replace(/[^\wäöüÄÖÜß-]+/g,"_") : "Zaehlung_alle_Felder");
  dl(csv, nm+"_"+new Date().toISOString().slice(0,10)+".csv");
}

        if(await askConfirm(`Kategorie „${c.label}“ löschen? ${n} Einträge (Zählung + Etiketten) werden mitgelöscht.`, "Löschen", true)){
          S.cats = S.cats.filter(x=>x.id!==c.id);
          S.layout.forEach(r=>{ r.cells = r.cells.map(x=>x==="c:"+c.id?null:x); });
          Object.keys(S.orders).forEach(k=>{ if(k.split("|")[1]===c.id) delete S.orders[k]; });
          S.fields.forEach(f=>f.subs.forEach(sub=>{
            for(const k in sub.counts){ if(k.split("|")[0]===c.id) delete sub.counts[k]; }
            for(const k in (sub.labels||{})){ if(k.split("|")[0]===c.id) delete sub.labels[k]; }
            sub.log = sub.log.filter(k=>k.split("|")[0]!==c.id);
            sub.llog = (sub.llog||[]).filter(k=>k.split("|")[0]!==c.id);
          }));
          save(); render();
        }
      }
      /* Kunden */
      if(act==="addC"){
        if(S.customers.length>=20){ await askConfirm("Maximal 20 Kunden möglich.","Verstanden"); return; }
        const n = await askText("Name des neuen Kunden:", "");
        if(n){ S.customers.push({id:uid(), name:n, color:"#3a6d4f", img:null}); save(); render(); }
      }
      if(act==="renC"){ const c=getC(); const n=await askText("Kunde umbenennen:", c.name); if(n){ c.name=n; save(); render(); } }
      if(act==="movC"){ const c=getC(); if(await moveInArray(S.customers, S.customers.indexOf(c), "„"+c.name+"“ verschieben")){ save(); render(); } }
      if(act==="renGl"){ const n=await askText("Systemetikett umbenennen:", S.gleich.name); if(n){ S.gleich.name=n; save(); render(); } }
      if(act==="delC"){
        const c=getC(); const n=custGrandTotal(c.id);
        if(await askConfirm(`Kunde „${c.name}“ löschen? ${n} vergebene Etiketten und alle Bestellungen werden gelöscht.`, "Löschen", true)){
          S.customers = S.customers.filter(x=>x.id!==c.id);
          Object.keys(S.orders).forEach(k=>{ if(k.split("|")[0]===c.id) delete S.orders[k]; });
          S.fields.forEach(f=>f.subs.forEach(sub=>{
            for(const k in (sub.labels||{})){ if(k.split("|")[1]===c.id) delete sub.labels[k]; }
            sub.llog = (sub.llog||[]).filter(k=>k.split("|")[1]!==c.id);
          }));
          save(); render();
        }
      }
      /* Bestellungen */
      if(act==="addO"){
        const c=getC();
        const i = await askChoice("Kategorie für "+c.name, S.cats.map(x=>x.label));
        if(i===null) return;
        const q = await askText("Bestellte Stückzahl:", "");
        const num = parseInt(String(q||"").replace(/\D/g,""),10);
        if(num>0){ S.orders[orderKey(c.id, S.cats[i].id)] = num; save(); render(); }
      }
      if(act==="qtyO"){
        const k = el.dataset.o;
        const q = await askText("Bestellte Stückzahl:", String(S.orders[k]||""));
        const num = parseInt(String(q||"").replace(/\D/g,""),10);
        if(num>0){ S.orders[k]=num; save(); render(); }
      }
      if(act==="delO"){
        const k = el.dataset.o;
        if(await askConfirm("Bestellung löschen? Vergebene Etiketten bleiben erhalten.","Löschen",true)){ delete S.orders[k]; save(); render(); }
      }
      /* Merkmale */
      if(act==="renFl"){ const fl=getFl(); const n=await askText("Merkmal umbenennen:", fl.name); if(n){ fl.name=n; save(); render(); } }
      if(act==="addFl"){ const n=await askText("Name des neuen Merkmals:",""); if(n){ S.flags.push({id:uid(), name:n, color:"#555f5b"}); save(); render(); } }
      if(act==="delFl"){
        const fl=getFl();
        if(await askConfirm(`Merkmal „${fl.name}“ löschen? Markierte Einträge bleiben erhalten (dann ohne Merkmal).`,"Löschen",true)){
          S.fields.forEach(f=>f.subs.forEach(sub=>{
            for(const k in Object.assign({},sub.counts)){
              const p=k.split("|");
              if(p[1]===fl.id){ const nk=p[0]+"|"; sub.counts[nk]=(sub.counts[nk]||0)+sub.counts[k]; delete sub.counts[k]; }
            }
            for(const k in Object.assign({},(sub.labels||{}))){
              const p=k.split("|");
              if(p[2]===fl.id){ const nk=p[0]+"|"+p[1]+"|"; sub.labels[nk]=(sub.labels[nk]||0)+sub.labels[k]; delete sub.labels[k]; }
            }
            sub.log = sub.log.map(k=>{ const p=k.split("|"); return p[1]===fl.id?p[0]+"|":k; });
            sub.llog = (sub.llog||[]).map(k=>{ const p=k.split("|"); return p[2]===fl.id?p[0]+"|"+p[1]+"|":k; });
          }));
          S.flags = S.flags.filter(x=>x.id!==fl.id);
          S.layout.forEach(r=>{ r.cells = r.cells.map(x=>x==="f:"+fl.id?null:x); });
          if(armedFlag===fl.id) armedFlag=null;
          save(); render();
        }
      }
      /* Felder */
      if(act==="addF"){ const n=await askText("Name des neuen Feldes:","Feld "+(S.fields.length+1)); if(n){ S.fields.push({id:uid(),name:n,subs:[newSub("Bereich A")]}); save(); render(); } }
      if(act==="renF"){ const f=getF(); const n=await askText("Feld umbenennen:", f.name); if(n){ f.name=n; save(); render(); } }
      if(act==="delF"){
        const f=getF();
        if(S.fields.length<=1){ await askConfirm("Mindestens ein Feld muss bleiben.","Verstanden"); return; }
        const t = f.subs.reduce((a,s)=>a+subTotal(s)+subLabelTotal(s),0);
        if(await askConfirm(`Feld „${f.name}“ mit ${t} Einträgen wirklich löschen?`,"Löschen",true)){
          S.fields = S.fields.filter(x=>x.id!==f.id);
          if(S.activeField===f.id){ S.activeField=S.fields[0].id; ensureActiveSub(); }
          save(); render();
        }
      }
      if(act==="addS"){ const f=getF(); const n=await askText("Name des Unterbereichs:","Bereich "+String.fromCharCode(65+f.subs.length)); if(n){ f.subs.push(newSub(n)); save(); render(); } }
      if(act==="renS"||act==="delS"){
        const f=getF(); const sub=f.subs.find(x=>x.id===el.dataset.s);
        if(act==="renS"){ const n=await askText("Unterbereich umbenennen:", sub.name); if(n){ sub.name=n; save(); render(); } }
        else {
          if(f.subs.length<=1){ await askConfirm("Jedes Feld braucht mindestens einen Unterbereich.","Verstanden"); return; }
          if(await askConfirm(`„${sub.name}“ mit ${subTotal(sub)+subLabelTotal(sub)} Einträgen löschen?`,"Löschen",true)){
            f.subs = f.subs.filter(x=>x.id!==sub.id);
            if(S.activeSub===sub.id) ensureActiveSub();
            save(); render();
          }
        }
      }
    };
  });

  document.getElementById("btnBackup").onclick = ()=>{
    const blob = new Blob([JSON.stringify(S)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Baumzaehler_Sicherung_" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  };
  document.getElementById("btnRestore").onclick = ()=>document.getElementById("fileRestore").click();
  document.getElementById("fileRestore").onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = async ()=>{
      try{
        const s = JSON.parse(r.result);
        if(!s.fields) throw 0;
        if(await askConfirm("Aktuelle Daten durch die Sicherung ersetzen?","Wiederherstellen",true)){
          S = normalize(s); ensureActiveSub(); save(); render();
        }
      }catch(_){ await askConfirm("Datei konnte nicht gelesen werden.","Verstanden"); }
    };
    r.readAsText(file);
  };
  document.getElementById("btnReset").onclick = async ()=>{
    const c = await askChoice("Was soll gelöscht werden?", ["Nur Etiketten","Nur Zählungen","Etiketten UND Zählungen"]);
    if(c===null) return;
    const txt = c===0?"alle Etiketten":c===1?"alle Zählungen":"alle Etiketten und Zählungen";
    if(await askConfirm(`Wirklich ${txt} in ALLEN Feldern löschen? Kategorien, Kunden, Bestellungen, Felder und Layout bleiben erhalten.`,"Weiter",true)){
      if(await askConfirm("Letzte Sicherheitsfrage: unwiderruflich löschen?","Ja, löschen",true)){
        S.fields.forEach(f=>f.subs.forEach(s=>{
          if(c===0||c===2){ s.labels={}; s.llog=[]; }
          if(c===1||c===2){ s.counts={}; s.log=[]; }
        }));
        save(); render();
      }
    }
  };
}

render();


/* --- Bereinigung: alten Service Worker und dessen Cache entfernen --- */
(function(){
  try{
    if("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
    }
    if(window.caches && caches.keys){
      caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
    }
  }catch(e){}
})();

</script>
</body>
